name: 'Raw UPF Presetup'

runs:
  using: "composite"
  steps:
    - uses: awalsh128/cache-apt-pkgs-action@v1.5.2
      with:
        packages: clang llvm gcc-multilib libbpf-dev
        version: 1.0

    - name: Ensure llvm-strip is available
      shell: bash
      run: which llvm-strip || sudo apt-get install -y llvm

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.21.0'
        cache: true

    - name: Install swaggo
      shell: bash
      run: go install github.com/swaggo/swag/cmd/swag@v1.8.12

    - name: Compile ebpf, generate go wrappers, generate swagger files.
      shell: bash
      run: go generate -v ./cmd/...
