# CNTi Test Suite configuration for the essential tests run by
# .github/workflows/cnti.yml. The chart is installed with its defaults; the
# only settings are the released image tags the rolling update, downgrade
# and rollback tests move to.
---
config_version: "v2"
common:
  container_names:
    - name: eupf
      rolling_update_test_tag: "0.7.0"
      rolling_downgrade_test_tag: "0.6.4"
      rolling_version_change_test_tag: "0.7.0"
      rollback_from_tag: "0.7.0"
deployments:
  helm_dirs:
    - name: eupf
      helm_directory: ../../.deploy/helm/eupf
      namespace: eupf
