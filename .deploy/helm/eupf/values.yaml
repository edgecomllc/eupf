---

global:
  imagePullPolicy: IfNotPresent

replicaCount: 1

# See `kubectl explain deployment.spec.strategy` for more
# ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
deploymentStrategy:
  type: RollingUpdate

deploymentType: deployment
# deploymentType: statefulset

image:
  registry: ghcr.io
  repository: edgecomllc
  name: eupf
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Empty by default: falls back to global.imagePullPolicy.
  pullPolicy: ""

# Override default container command
command: []

# Override default container args
args: []

initContainers: []
  # - name: run-db-migrations
  #   # if "" then uses default image for this chart
  #   image: ""
  #   command:
  #     - /bin/sh
  #     - -ec
  #     - |
  #       python3 manage.py migrate
  # - name: run-something
  #   image: ""
  #   command:
  #     - /bin/sh
  #     - -ec
  #     - |
  #       echo "start something"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Default UPF_* environment variables. Injected only when config.enabled=false
# (ENV mode). Individual entries can be overridden via `env` below or your own
# values file; eUPF also falls back to built-in defaults for anything unset.
defaultEnv:
  UPF_INTERFACE_NAME: eth0
  UPF_API_ADDRESS: ":8080"
  UPF_PFCP_ADDRESS: ":8805"
  UPF_METRICS_ADDRESS: ":9090"
  UPF_PFCP_NODE_ID: $(MY_POD_IP)
  UPF_N3_ADDRESS: $(MY_POD_IP)

# Additional environment variables (merged on top of defaultEnv).
env: {}
  # UPF_INTERFACE_NAME: eth0,n6
  # UPF_LOGGING_LEVEL: debug

# eUPF configuration source.
# enabled=false (default): configure via UPF_* environment variables
# (the chart injects a working default set, see helpers/_pod.tpl).
# enabled=true: create a ConfigMap from config.data, mount it at config.mountPath
# and run the container with `--config <config.path>`. In this mode the default
# UPF_* env injection is disabled because environment variables take precedence
# over the config file in eUPF.
config:
  enabled: false
  path: /app/conf/config.yml
  mountPath: /app/conf
  data: {}
    # config.yml: |
    #   interface_name: eth0
    #   api_address: :8080
    #   pfcp_address: :8805
    #   metrics_address: :9090

# create config maps
configMaps: {}
  # config:
  #   additionalLabels:
  #     foo: bar
  #   additionalAnnotations:
  #     foo: bar
  #   data:
  #     config.yml: |
  #       foo: bar

# volumes.
# The /sys hostPath volume is required: the container entrypoint mounts
# bpffs and debugfs under /sys to load the eBPF data plane.
volumes:
  - name: sys
    hostPath:
      path: /sys

# volume mounts
volumeMounts:
  - name: sys
    mountPath: /sys
    readOnly: true

hostNetwork: false

xdpProgrammInstall:
  enabled: false
  securityContext:
    capabilities:
      add:
        - NET_ADMIN
        - BPF
    privileged: true
    runAsNonRoot: false
  env:
    - name: POD_N6_IP
      value: 10.100.100.12
  command:
    - /bin/sh
    - -c
    - |
      apk add iproute2; \
      echo "starting"; \
      i=0; IFACE_NAME=""; \
      while [ -z "$IFACE_NAME" ]; \
      do \
        echo "check $i: searching interface name"; sleep 1; \
        IFACE_NAME=$(ip route list ${POD_N6_IP} | awk '{print $3}'); \
        i=$((i+1)); \
      done ;\
      echo "done: current interface name is ${IFACE_NAME}" ;\
      set -x ;\
      ls -alh /app ;\
      ip link set dev ${IFACE_NAME} xdpdrv obj /app/zeroentrypoint_bpf.o sec xdp/upf_zero_entrypoint

bird:
  enabled: false
  image: docker.io/edgecom/bird:0.0.4
  env:
    BIRD_ROUTER_ID: $(MY_POD_IP)
    BIRD_LOCAL_AS: 65000
    BIRD_LOCAL_PREFIX: 10.45.0.0/16
    BIRD_NEIGHBOR_IP: $(MY_NODE_IP)
    BIRD_NEIGHBOR_AS: 64512
  service:
    enabled: false
    type: ClusterIP
    port: 179
  ports:
    - name: bgp
      containerPort: 179
      protocol: TCP
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  livenessProbe:
    tcpSocket:
      port: bgp
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: bgp
    initialDelaySeconds: 5
    periodSeconds: 10

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

metrics:
  enabled: false
  serviceMonitor:
    # Create ServiceMonitor Resource for scraping metrics using Prometheus Operator
    enabled: false
    # Namespace for the ServiceMonitor Resource (defaults to the Release Namespace)
    namespace: ""
    # Interval at which metrics should be scraped.
    # ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    interval: ""
    # Timeout after which the scrape is ended
    # ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    scrapeTimeout: ""
    # Additional labels that can be used so ServiceMonitor will be discovered by Prometheus
    labels: {}
    # Prometheus instance selector labels
    # ref: https://github.com/bitnami/charts/tree/main/bitnami/prometheus-operator#prometheus-configuration
    selector: {}
    # RelabelConfigs to apply to samples before scraping
    relabelings: []
    # MetricRelabelConfigs to apply to samples before ingestion
    metricRelabelings: []
    # Specify honorLabels parameter to add the scrape endpoint
    honorLabels: false
    # The name of the label on the target service to use as the job name in prometheus.
    jobLabel: ""
    endpoints:
      port: metrics
      path: "/metrics"

podAnnotations: {}

podSecurityContext:
  # net.ipv4.ip_forward is an unsafe sysctl: nodes must allow it via
  # kubelet --allowed-unsafe-sysctls=net.ipv4.ip_forward
  sysctls:
    - name: net.ipv4.ip_forward
      value: "1"

# eUPF loads eBPF programs, mounts bpffs/debugfs and raises RLIMIT_MEMLOCK,
# which requires elevated privileges. If your environment allows it, a more
# fine-grained alternative is:
#   capabilities:
#     add: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE, BPF, PERFMON]
securityContext:
  privileged: true

extraContainerPorts:
  - name: metrics
    containerPort: 9090
    protocol: TCP

service:
  type: ClusterIP
  # Must match the eUPF API address (UPF_API_ADDRESS / api_address), default :8080.
  port: 8080
  extraPorts:
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

startupProbe: {}
  # We usually recommend to specify probes, read https://habr.com/ru/company/nixys/blog/544288/
  # httpGet:
  #   path: /healthz
  #   port: http
  # failureThreshold: 30
  # periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}

# Array of extra objects to deploy with the release
extraDeploy: []
  # - apiVersion: k8s.cni.cncf.io/v1
  #   kind: NetworkAttachmentDefinition
  #   metadata:
  #     name: n3network-upf
  #     namespace: free5gc
  #   spec:
  #     config: |
  #       {
  #         "cniVersion": "0.3.1",
  #         "plugins": [
  #           {
  #             "type": "ipvlan",
  #             "capabilities": { "ips": true },
  #             "master": "ens3",
  #             "mode": "l2",
  #             "ipam": {
  #               "type": "static",
  #               "routes": [
  #                 {
  #                   "dst": "0.0.0.0/0",
  #                   "gw": "10.100.50.238"
  #                 }
  #               ]
  #             }
  #           }
  #         ]
  #       }

ui:
  enabled: false
  image:
    registry: ghcr.io
    repository: edgecomllc
    name: eupf-ui
    tag: main
    pullPolicy: Always
  env:
    API_ADDR: localhost:8080
  service:
    port: 8081
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
